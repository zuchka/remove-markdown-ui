[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/share"
  to = "/.netlify/functions/share-create"
  status = 200

[[redirects]]
  from = "/api/share/:id"
  to = "/.netlify/functions/share-get"
  status = 200

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
